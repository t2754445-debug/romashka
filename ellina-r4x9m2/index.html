@font-face{font-family:'Nunito';src:url(../assets/fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{

*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.6 var(--tf);-webkit-font-smoothing:antialiased;

.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:1px;animation:tw 3.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.drone{position:absolute;width:44px;animation:fly linear infinite}
.drone svg{width:100%;height:auto;display:block}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(calc(100vw + 80px))}}
.drone .blink{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.city{position:absolute;left:0;right:0;bottom:0;height:170px;opacity:.6}
.city svg{width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1}

header{display:flex;align-items:center;gap:14px 26px;flex-wrap:wrap;padding:16px 24px;max-width:1240px;margin:0 auto}
.logo{display:flex;flex-direction:column;line-height:.95;color:#fff}
.logo b{font:700 13px var(--hf);letter-spacing:.02em}
.logo .rb{font-size:26px;margin-top:4px}
.rb{font-family:var(--hf);font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.brand-h{font:900 clamp(40px,6vw,72px)/1 var(--hf);margin:0 0 6px}
.rb span:nth-child(6n+1){color:#ff4a50}.rb span:nth-child(6n+2){color:#ff7a45}.rb span:nth-child(6n+3){color:#3ccb52}
.rb span:nth-child(6n+4){color:#2fd3c3}.rb span:nth-child(6n+5){color:#7d93ff}.rb span:nth-child(6n+6){color:#e46cf0}
.round{font:700 13px var(--hf);color:var(--night);background:var(--win);padding:7px 14px;border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font:800 13.5px var(--tf);cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--win)}
.chip.on{background:var(--win);border-color:var(--win);color:var(--night)}
header .chip{margin-left:auto}

main{max-width:1240px;margin:0 auto;padding:8px 24px 240px;display:grid;grid-template-columns:340px 1fr;gap:34px}
.side{position:sticky;top:14px;align-self:start}
.guide{position:relative;display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;width:100%;background:#fff;color:#141c4a;border-radius:18px;padding:14px 16px;font-weight:700;font-size:15.5px;line-height:1.45;min-height:84px;box-shadow:0 0 0 3px #0e143a,0 10px 30px rgba(0,0,0,.35)}

.negan{width:180px;height:280px;margin-top:10px;image-rendering:pixelated;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.roof{width:240px;height:12px;border-radius:6px;background:var(--panel2);margin-top:-4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}

svg.daisy{width:210px;height:210px;display:block;margin:22px auto 0}
.petal{fill:var(--panel);stroke:var(--line);stroke-width:2;cursor:pointer;transition:fill .25s}
.petal:hover{stroke:var(--win)}
.petal.seen{fill:#5a4a1c;stroke:var(--win)}
.petal.cur{fill:var(--orange);stroke:#ffd0b0;filter:drop-shadow(0 0 10px rgba(255,106,26,.7))}
.pnum{font:700 14px var(--hf);fill:#fff;pointer-events:none}

.steps li::before{content:"";width:8px;height:8px;border-radius:2px;margin-top:8px;flex:none;background:var(--line)}
.steps li.seen::before{background:var(--win);box-shadow:0 0 8px var(--win)}
.steps li.cur::before{background:var(--orange)}

.card{background:linear-gradient(180deg,rgba(38,50,122,.92),rgba(31,42,102,.92));border:1.5px solid var(--line);border-radius:26px;padding:30px 32px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(6px);min-width:0}
.eyebrow{margin:0 0 8px;font-weight:800;font-size:15px;color:var(--win)}
h2{margin:0 0 12px;font:700 clamp(26px,3.6vw,40px)/1.1 var(--hf);letter-spacing:-.01em;text-wrap:balance}
.plain{margin:0 0 22px;color:var(--ink2);font-weight:700;max-width:62ch}
.lead{font-size:19px;line-height:1.5;font-weight:700;margin:0 0 22px;color:#fff;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:0 0 22px}
.tile{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);cursor:default}
.tile[data-go]{cursor:pointer}.tile[data-go]:hover{border-color:var(--win)}
.tile h3{margin:0 0 6px;font:700 12px var(--hf);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .big{font:700 20px/1.25 var(--hf)}
.tile.hot{background:rgba(245,195,79,.12);border-color:rgba(245,195,79,.5)}.tile.hot .big{color:var(--win)}
.tile ol,.tile ul{margin:0;padding-left:20px;color:var(--ink2);font-size:15.5px}
.box{margin:0 0 16px;padding:16px 20px;border-radius:18px}
.box h3{margin:0 0 8px;font:700 13px var(--hf);letter-spacing:.06em;text-transform:uppercase}
.box ul{margin:0;padding-left:20px}.box li{margin:6px 0}
.box.got{background:rgba(60,203,82,.1);border:1.5px solid rgba(60,203,82,.4)}.box.got h3{color:#7ee38e}

.dela{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.dela label{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;font-weight:800}
.dela input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.dela input:checked+span{color:var(--muted);text-decoration:line-through}
.talkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.talkhead h3{margin:0;font:700 20px var(--hf);color:var(--win);margin-right:auto}
.line{display:flex;margin:7px 0}
.line .say{max-width:88%;padding:9px 14px;border-radius:16px;font-size:15.5px}
.line .nm{display:block;font:800 12px var(--tf);margin-bottom:1px}
.line.v .say{background:rgba(10,14,42,.45);color:var(--ink2);border-top-left-radius:4px}.line.v .nm{color:#a9b8ff}
.line.e{justify-content:flex-end}
.line.e .say{background:rgba(245,195,79,.14);border:1.5px solid rgba(245,195,79,.35);color:#fff;font-size:17px;border-top-right-radius:4px}.line.e .nm{color:var(--win)}
.line.role .say{background:rgba(255,106,26,.14);border-color:rgba(255,106,26,.45)}.line.role .nm{color:#ffa26b}
.line.u .say{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}.line.u .nm{color:var(--muted)}
.line.aside .say{background:transparent;color:var(--muted);font-style:italic;font-size:14px;padding:2px 14px}.line.aside .nm{display:inline;margin-right:6px}
.only-her .line.v,.only-her .line.u,.only-her .line.aside{display:none}
.unsure{border-bottom:2px dotted var(--muted);cursor:help}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{font:800 16px var(--tf);padding:13px 26px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.btn:hover{border-color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--orange);border-color:var(--orange);box-shadow:0 8px 24px rgba(255,106,26,.45)}
.btn.pri:hover{background:var(--orange-d)}
.muted{color:var(--muted);font-size:14.5px;font-weight:700}
.credit{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;color:var(--muted);font-size:14px;font-weight:700}
.credit b{color:#fff}
@media(max-width:600px){.card{padding:22px 16px;border-radius:20px}.line .say{max-width:94%}}
@media(max-width:900px){
  main{display:flex;flex-direction:column;gap:18px;padding:8px 16px 200px}header{padding:14px 16px}
  .side{display:contents}.guide{order:1}#view{order:2}svg.daisy{order:3;margin:0 auto}.steps{order:4}
  .guide{display:grid;grid-template-columns:96px 1fr;align-items:end;gap:0 12px}
  .bubble{grid-column:2;grid-row:1}.bubble::after{left:-12px;bottom:22px;margin:0;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
  .negan{grid-column:1;grid-row:1;width:96px;height:150px;margin:0}.roof{display:none}
}

<script>

сультант финансовый, но это про гибкость. Гибкость, не знаю. В общем, я ответила, кажется."]]}, {"id": "6", "short": "Вселенная изобильна", "title": "Вселенная, в которой мы живём, дружелюбна и изобильна", "plain": "Допускаем, что всего хватает: денег, людей, шансов. Ищем ходы, которые не видно из страха.", "pose": "idle", "negan": "«Взяла бы деньги и вложила. Во что — не знаю». Запомни эту фразу, Вова к ней ещё вернётся. А про скрытые выгоды ты сама начала — не бросай.", "got": ["Затык: «всё возможно», но непонятно, какой первый шаг, — «ступорное состояние».", "Сама выдвинула гипотезу: возможно, есть скрытые выгоды, из-за которых ты не хочешь стать богатой.", "Шаги: чёткое намерение на срок («в следующем месяце начнутся такие-то процессы»), дорожная карта проекта, разговоры с теми, кто уже достиг, — узнать их первые шаги.", "«Если бы было возможно всё» — «я бы взяла деньги и вложила их. Но во что — я не знаю». Потом: одни деньги сюда, другие туда."], "side": ["Отсюда то, что Вова отметил в обратной связи: первое движение — вложить, анализ потом.", "Тему скрытых выгод ты подняла сама, но не раскрыла — хорошая тема для следующей работы."], "lines": [["v", "Вова", "Вселенная дружелюбна, в которой мы живем, дружелюбна и <span class=\"unsure\" title=\"возможно: изобильна\">ябедна</span>. Представь это, ассоциируйся с этим. Представь, что все много денег, денег, сложностей, а надень для себя эту <span class=\"unsure\" title=\"возможно: пресуппозицию\">приспозицию</span>."], ["e", "Эллина", "У меня она есть сейчас, в любом случае."], ["v", "Вова", "Если у тебя такие взгляды, как бы ты получил то, что хочешь?"], ["e", "Эллина", "Ну, здесь затык прям. Ну, то есть я понимаю, что все возможно, вот вообще все. Я не знаю, ступорное состояние, я не знаю, что мне сделать, первый шаг какой."], ["e", "Эллина", "Но я сейчас уже до этого их описала. Возможно, мне стоят скрытые выгоды. Надо посмотреть, почему я не хочу стать богатой и с пассивным доходом. Потому что все возможно, я зн   if (e.target.id === 'prev') open(cur - 1);
  if (e.target.id === 'next') open(cur + 1);
  if (e.target.id === 'only'){ onlyHer = !onlyHer; store.set('ell-only', onlyHer); $('talk').classList.toggle('only-her', onlyHer); e.target.classList.toggle('on', onlyHer); }
  const u = e.target.closest('.unsure');
  if (u) say(u.title.startsWith('возможно:') ? 'Здесь запись неразборчивая. Моя догадка: ' + u.title.slice(9).trim() + '.' : 'Здесь запись неразборчивая — что сказано, не разобрать даже мне.');
});
document.addEventListener('change', e => { if (e.target.dataset.d !== undefined){ dela[+e.target.dataset.d] = e.target.checked; store.set('ell-dela', dela); } });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') open(cur + 1); if (e.key === 'ArrowLeft') open(cur - 1); });
cur = Math.max(0, STEPS.findIndex(s => s.id === location.hash.slice(1)));  // #3 — сразу на лепесток
render();
</script>
</body>
</html>
